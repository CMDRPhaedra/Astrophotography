<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — Among Stars{% else %}Among Stars — Blog{% endif %}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 155 | default: site.description }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}Among Stars — Blog{% endif %}">
<meta property="og:description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 155 | default: site.description }}">
{% if page.image %}<meta property="og:image" content="{{ site.url }}{{ page.image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ site.url }}{{ page.image }}">{% endif %}
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
{% if page.noindex %}<meta name="robots" content="noindex, follow">
{% endif %}<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="alternate" type="application/rss+xml" title="Among Stars — Blog" href="{{ site.url }}/feed.xml">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0c0b09">
<script>
  (function(){
    try {
      var t=localStorage.getItem('theme');
      if(t==='light') document.documentElement.dataset.theme='light';
    } catch(e) {} // storage can be blocked (private browsing / cookie settings)
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --ink: #e8e2d9; --dim: #7a7468; --bg: #0c0b09; --accent: #c8a96e;
    --card-bg: #131210; --border: #2e2c28;
  }
  [data-theme="light"] {
    --ink: #1a1814; --dim: #8a8278; --bg: #f5f2ec; --accent: #a07840;
    --card-bg: #ffffff; --border: #ddd8ce;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif; min-height: 100vh; transition: background 0.35s, color 0.35s; }

  header { padding: 3.5rem 4rem 2rem; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem; border-bottom: 1px solid var(--border); transition: border-color 0.35s; }
  .site-title { font-size: clamp(1.8rem, 4.5vw, 3rem); font-weight: 300; letter-spacing: 0.04em; line-height: 1; }
  .site-title a { color: inherit; text-decoration: none; }
  .site-title em { font-style: italic; color: var(--accent); }
  .site-subtitle { font-family: 'Inconsolata', monospace; font-size: 0.7rem; font-weight: 300; color: var(--dim); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 0.5rem; }
  .header-right { display: flex; align-items: center; gap: 1.5rem; }
  nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .nav-btn { font-family: 'Inconsolata', monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; background: transparent; border: 1px solid var(--border); color: var(--dim); padding: 0.4rem 1rem; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-block; }
  .nav-btn:hover, .nav-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(200,169,110,0.06); }
  .theme-toggle { font-family: 'Inconsolata', monospace; font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; background: transparent; border: 1px solid var(--border); color: var(--dim); padding: 0.38rem 0.85rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.45rem; white-space: nowrap; }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  main { position: relative; z-index: 5; padding: 3rem 4rem 5rem; max-width: 760px; margin: 0 auto; }
  .blog-label { font-family: 'Inconsolata', monospace; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; }

  footer { border-top: 1px solid var(--border); padding: 2rem 4rem; text-align: center; font-family: 'Inconsolata', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  footer a { color: var(--dim); }
  footer a:hover { color: var(--accent); }

  @media (max-width: 900px) {
    header { padding: 2rem; }
    main { padding: 2.5rem 2rem 4rem; }
    footer { padding: 2rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="site-title"><a href="/">Dale — <em>Among Stars</em></a></div>
    <p class="site-subtitle">Astrophotography · Edinburgh, Scotland</p>
  </div>
  <div class="header-right">
    <nav>
      <a class="nav-btn" href="/">Gallery</a>
      <a class="nav-btn{% if page.url contains '/photos/' %} active{% endif %}" href="/photos/">Photos</a>
      <a class="nav-btn{% if page.url contains '/blog/' %} active{% endif %}" href="/blog/">Blog</a>
      <a class="nav-btn{% if page.url contains '/gear/' %} active{% endif %}" href="/gear/">Gear</a>
      <a class="nav-btn{% if page.url contains '/bortle/' %} active{% endif %}" href="/bortle/">Bortle</a>
      <a class="nav-btn" href="/feed.xml" title="RSS feed">RSS</a>
    </nav>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark theme">
      <span class="toggle-icon" id="toggle-icon">☀</span>
    </button>
  </div>
</header>

<main>
  {{ content }}
</main>

<footer>
  <a href="/">&larr; Back to the gallery</a>
  &nbsp;&middot;&nbsp;
  <a href="/privacy/">Privacy</a>
</footer>

<script>
  function applyThemeUI() {
    const isLight = document.documentElement.dataset.theme === 'light';
    document.getElementById('toggle-icon').textContent = isLight ? '☾' : '☀';
  }
  function toggleTheme() {
    const html = document.documentElement;
    const goLight = html.dataset.theme !== 'light';
    html.dataset.theme = goLight ? 'light' : 'dark';
    try { localStorage.setItem('theme', goLight ? 'light' : 'dark'); } catch(e) {}
    applyThemeUI();
  }
  applyThemeUI();
</script>

</body>
</html>
