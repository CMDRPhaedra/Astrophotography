<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png">
<meta name="theme-color" content="#0c0b09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* Deliberately standalone rather than reusing the site layout: these pages
     are reached from the Mac App Store, where the astrophotography header and
     navigation would be baffling. Same palette and type so they still look
     like part of chryse.co.uk. */
  :root { --ink: #e8e2d9; --dim: #7a7468; --bg: #0c0b09; --accent: #c8a96e; --border: #2e2c28; }
  @media (prefers-color-scheme: light) {
    :root { --ink: #1a1814; --dim: #8a8278; --bg: #f5f2ec; --accent: #a07840; --border: #ddd8ce; }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif; min-height: 100vh; }

  header { padding: 3.5rem 4rem 2rem; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem; border-bottom: 1px solid var(--border); }
  .app-title { font-size: clamp(1.8rem, 4.5vw, 3rem); font-weight: 300; letter-spacing: 0.04em; line-height: 1; }
  .app-title em { font-style: italic; color: var(--accent); }
  .app-subtitle { font-family: 'Inconsolata', monospace; font-size: 0.7rem; font-weight: 300; color: var(--dim); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 0.5rem; }
  nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .nav-btn { font-family: 'Inconsolata', monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid var(--border); color: var(--dim); padding: 0.4rem 1rem; transition: all 0.2s; text-decoration: none; }
  .nav-btn:hover, .nav-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(200,169,110,0.06); }

  main { padding: 3rem 4rem 5rem; max-width: 760px; margin: 0 auto; }
  .blog-label { font-family: 'Inconsolata', monospace; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; }

  .anchor-body h3 { font-size: 1.45rem; font-weight: 400; margin: 2.6rem 0 0.8rem; }
  .anchor-body p, .anchor-body ul { margin-bottom: 1.2rem; font-size: 1.08rem; line-height: 1.65; }
  .anchor-body ul { padding-left: 1.4rem; }
  .anchor-body li { margin-bottom: 0.5rem; }
  .anchor-body a { color: var(--accent); }
  .anchor-body code { font-family: 'Inconsolata', monospace; font-size: 0.92em; color: var(--dim); }

  footer { border-top: 1px solid var(--border); padding: 2rem 4rem 3rem; font-family: 'Inconsolata', monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); text-align: center; }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  @media (max-width: 640px) {
    header, main, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="app-title"><em>Anchor</em></div>
    <p class="app-subtitle">For macOS</p>
  </div>
  <nav>
    <a class="nav-btn{% if page.url contains '/support/' %} active{% endif %}" href="/anchor/support/">Support</a>
    <a class="nav-btn{% if page.url contains '/privacy/' %} active{% endif %}" href="/anchor/privacy/">Privacy</a>
  </nav>
</header>

<main>
  {{ content }}
</main>

<footer>
  <a href="https://chryse.co.uk/">chryse.co.uk</a>
</footer>

</body>
</html>
