# Jekyll config for the /blog section.
#
# GitHub Pages builds this automatically on every push to main — there is no
# separate Action, no build step to maintain, and no API cost. index.html and
# everything else in the repo is untouched: only files with YAML front matter
# (the --- block at the top) get processed by Jekyll. index.html has none, so
# it's still served exactly as-is.

title: Among Stars
description: "Astrophotography from Edinburgh, Scotland — deep-sky notes on galaxies, nebulae, clusters and comets captured with a Dwarf 3 smart telescope."
url: "https://chryse.co.uk"

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# Per-photo pages: one page per entry in index.html's CAPTURES array, at
# /photos/<slug>/. The files in _captures/ are generated by
# scripts/generate_capture_pages.py (run by the convert-webp workflow) —
# never edit them by hand.
collections:
  captures:
    output: true
    permalink: /photos/:name/

# jekyll-sitemap and jekyll-feed are both on GitHub Pages' approved plugin
# list, so this works with no Gemfile and no extra build step.
plugins:
  - jekyll-sitemap
  - jekyll-feed

# jekyll-feed ships 10 posts by default, which silently drops the oldest ones
# from the RSS feed as the archive grows.
feed:
  posts_limit: 50

# Keep Jekyll from trying to process repo files that aren't part of the site.
# sitemap.xml is generated automatically by jekyll-sitemap on every build.
exclude:
  - convert_to_webp.py
  - scripts/
  - LICENSE
  - README.md
  - "*.py"
